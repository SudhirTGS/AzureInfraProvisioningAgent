name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"

permissions:
  id-token: write # required for Azure OIDC login
  contents: read
  pull-requests: write # required to post the plan as a PR comment

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff changed paths against the base branch

      - name: Determine changed infra directory
        id: tfdir
        run: |
          CHANGED_DIR=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep '^infra/' | head -n 1 | xargs -r dirname)
          if [ -z "$CHANGED_DIR" ]; then
            echo "No infra/** changes detected in this PR." >&2
            exit 1
          fi
          echo "dir=$CHANGED_DIR" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ steps.tfdir.outputs.dir }}
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        working-directory: ${{ steps.tfdir.outputs.dir }}
        env:
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join('${{ steps.tfdir.outputs.dir }}', 'plan.txt');
            const plan = fs.existsSync(planPath) ? fs.readFileSync(planPath, 'utf8') : '(no plan output — see job logs)';
            const marker = '<!-- tf-plan-bot -->';
            const body = `${marker}\n### Terraform Plan: \`${{ steps.tfdir.outputs.dir }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
